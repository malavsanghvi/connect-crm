<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Workspaces" style="width: 88px; height: {{railH}}; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #DDE6F0; display: flex; flex-direction: column; align-items: stretch; padding: 12px 8px; gap: 4px; font-family: 'DM Sans', system-ui, sans-serif; color: #2C3A55">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
    <a href="{{it.href}}" aria-label="{{it.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border-radius: 14px; background: {{it.bg}}; color: {{it.fg}}; font-size: 12px; font-weight: {{it.weight}}; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      <span>{{it.label}}</span>
    </a>
  </sc-for>
  <div style="flex: 1"></div>
  <a href="{{settings.href}}" aria-label="Settings" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border-radius: 14px; background: {{settings.bg}}; color: {{settings.fg}}; font-size: 12px; font-weight: {{settings.weight}}; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{settings.d}}"></path></svg>
    <span>Settings</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"home"},"height":{"editor":"int","default":916,"min":400,"max":3000},"$preview":{"width":88,"height":916}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const h = this.props.height ?? 916;
    const defs = [
      { id: 'home', label: 'Today', href: 'Main.dc.html', d: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z' },
      { id: 'routine', label: 'Routine', href: 'Routines.dc.html', d: 'M9 6h11 M9 12h11 M9 18h11 M4 6l1.2 1.2L7 5.4 M4 12l1.2 1.2L7 11.4 M4 18l1.2 1.2L7 17.4' },
      { id: 'people', label: 'People', href: 'People.dc.html', d: 'M15.5 8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z M4.5 21c0-3.9 3.4-6 7.5-6s7.5 2.1 7.5 6' },
      { id: 'giving', label: 'Giving', href: 'Giving.dc.html', d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z' },
      { id: 'events', label: 'Events', href: 'Events.dc.html', d: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4' },
      { id: 'messages', label: 'Messages', href: 'ScreenMap.dc.html', d: 'M3 5h18v14H3z M3 6l9 7 9-7' },
      { id: 'learning', label: 'Learning', href: 'ScreenMap.dc.html', d: 'M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z M4 5v15 M8 7h7' },
      { id: 'store', label: 'Store', href: 'ScreenMap.dc.html', d: 'M5 8h14l-1 12H6z M9 8a3 3 0 0 1 6 0' },
      { id: 'market', label: 'Marketplace', href: 'Marketplace.dc.html', d: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z' }
    ];
    const style = (id) => id === active
      ? { bg: '#E8F1FC', fg: '#1C56B0', weight: '700' }
      : { bg: 'transparent', fg: '#2C3A55', weight: '600' };
    return {
      railH: h + 'px',
      items: defs.map((x) => ({ ...x, ...style(x.id) })),
      settings: { href: 'Setup.dc.html', d: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2', ...style('settings') }
    };
  }
}
</script>
</body>
</html>
