name: Database tests

on:
  push:
    paths: ["supabase/**", ".github/workflows/db-tests.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/db-tests.yml"]

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed, RLS and rule tests
        env:
          PGURL: postgres://postgres:postgres@localhost:5432
        run: bash supabase/tests/run_local.sh
      - name: Generate types
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/connect_test
        run: node supabase/scripts/gen-types.mjs > /tmp/database.types.ts
      # The generated file as an artifact, so a machine without Postgres can take it verbatim
      # (gh run download <run id> -n database-types) for src/lib/database.types.ts here and in
      # connect-admin and connect-mobile.
      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: /tmp/database.types.ts
      - name: Generated types are up to date
        run: |
          diff -u src/lib/database.types.ts /tmp/database.types.ts || (echo "::error::src/lib/database.types.ts is stale — regenerate with supabase/scripts/gen-types.mjs, or download this run's database-types artifact" && exit 1)
