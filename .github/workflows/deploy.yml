# Deploy to the DigitalOcean droplet. Runs on every push to main, or by hand from
# Actions › Deploy › Run workflow. Setup and the list of secrets: docs/DEPLOY.md
# (in connect-crm).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crm
  cancel-in-progress: false

jobs:
  database:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing secret SUPABASE_DB_URL (Supabase › Connect › Session pooler). See docs/DEPLOY.md."
            exit 1
          fi
          bash supabase/scripts/migrate.sh

  deploy:
    name: Build and release crm
    needs: database
    runs-on: ubuntu-latest
    env:
      APP: crm
      SITE: ${{ vars.SITE_DOMAIN || ':80' }}
      # JSH's Supabase project. The publishable key is public by design: it ships in every
      # browser and phone build and row-level security protects the data. Repository
      # variables SUPABASE_URL / SUPABASE_ANON_KEY override these (e.g. for a staging project).
      # Never put the secret (sb_secret_… / service_role) key here or anywhere in the apps.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://qenubcnvjcmsxhmehvat.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_EfX8-WUrsYuSkUB4vAFAIQ_ukUY01jy' }}
      NEXT_PUBLIC_CENTER_SLUG: ${{ vars.CENTER_SLUG || 'jsh' }}
      # Optional (onboarding, more than one organization; docs/DEPLOY.md "Organization addresses"):
      # SITE_WILDCARD_DOMAIN serves <slug>.<domain> and organizations' own domains; MEMBER_APP_URL is
      # the member web app's address, used for the https join links. Unset: nothing changes.
      SITE_WILDCARD_DOMAIN: ${{ vars.SITE_WILDCARD_DOMAIN }}
      NEXT_PUBLIC_MEMBER_APP_URL: ${{ vars.MEMBER_APP_URL }}
    steps:
      - name: Check settings
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DROPLET_HOST"
          [ -n "$KEY" ]  || missing="$missing DROPLET_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Not set in Settings › Secrets and variables › Actions › Secrets:$missing (see docs/DEPLOY.md in connect-crm)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Package
        run: |
          mkdir -p out
          cp -r .next/standalone/. out/
          mkdir -p out/.next && cp -r .next/static out/.next/static
          if [ -d public ]; then cp -r public out/public; fi
          tar -czf "connect-$APP-$GITHUB_SHA.tgz" -C out .
      - name: Release on the droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          # o-messaging (optional; docs/DEPLOY.md › Messaging)
          PORTAL_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          POSTMARK_WEBHOOK_TOKEN: ${{ secrets.POSTMARK_WEBHOOK_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ vars.TWILIO_FROM_NUMBER }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
          MESSAGING_FROM_ADDRESS: ${{ vars.MESSAGING_FROM_ADDRESS }}
          MESSAGING_FROM_NAME: ${{ vars.MESSAGING_FROM_NAME }}
          MESSAGING_EMAIL_PROVIDER: ${{ vars.MESSAGING_EMAIL_PROVIDER }}
          MESSAGING_LINK_SECRET: ${{ secrets.MESSAGING_LINK_SECRET }}
          PORTAL_PUBLIC_URL: ${{ vars.PORTAL_PUBLIC_URL }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_() { ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" "$@"; }
          ssh_ "mkdir -p /tmp/connect-deploy"
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/droplet-setup.sh deploy/release.sh "root@$HOST:/tmp/connect-deploy/"
          scp -i ~/.ssh/deploy -o BatchMode=yes "connect-$APP-$GITHUB_SHA.tgz" "root@$HOST:/tmp/"
          # o-messaging: the portal's server-only secrets (Supabase Auth hooks, provider webhooks,
          # unsubscribe links). Sent over SSH stdin, written root-only; empty values are left out.
          # Unset: the hook / webhook routes answer 503 "isn't configured" (docs/DEPLOY.md › Messaging).
          {
            for v in PORTAL_DATABASE_URL SEND_EMAIL_HOOK_SECRET SEND_SMS_HOOK_SECRET RESEND_API_KEY POSTMARK_SERVER_TOKEN \
                     RESEND_WEBHOOK_SECRET POSTMARK_WEBHOOK_TOKEN TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER \
                     TWILIO_MESSAGING_SERVICE_SID MESSAGING_FROM_ADDRESS MESSAGING_FROM_NAME MESSAGING_EMAIL_PROVIDER \
                     MESSAGING_LINK_SECRET PORTAL_PUBLIC_URL; do
              if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}"; fi
            done
          } | ssh_ "umask 077 && mkdir -p /srv/connect && cat > /srv/connect/$APP.secrets.env"
          ssh_ "bash /tmp/connect-deploy/droplet-setup.sh && SITE_WILDCARD_DOMAIN='$SITE_WILDCARD_DOMAIN' bash /tmp/connect-deploy/release.sh $APP $GITHUB_SHA node 3000 '$SITE'"
          echo "### Released $APP" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SITE" == :* ]]; then
            port=${SITE#:}
            if [ "$port" = 80 ]; then echo "Open http://$HOST" >> "$GITHUB_STEP_SUMMARY"; else echo "Open http://$HOST:$port" >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "Open https://$SITE" >> "$GITHUB_STEP_SUMMARY"
          fi

  # connect-crm only: the background service (docs/DEPLOY.md › Background service).
  # Skipped, with a notice, until the WORKER_DATABASE_URL secret exists; the portal
  # then shows "Background service not configured".
  worker:
    name: Build and release the background service
    needs: [database, deploy]
    runs-on: ubuntu-latest
    env:
      APP: worker
      HEALTH_PORT: "3010"
    steps:
      - name: Check settings
        id: check
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: |
          if [ -z "$WORKER_DATABASE_URL" ]; then
            echo "::notice title=Background service skipped::WORKER_DATABASE_URL is not set in Settings › Secrets and variables › Actions › Secrets, so the background service (connect@worker) was not deployed. Background jobs, the secret vault's readers and storage retention do not run until it is. See docs/DEPLOY.md › Background service."
            echo "### Background service skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "WORKER_DATABASE_URL is not set (docs/DEPLOY.md › Background service)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$WORKER_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::WORKER_DATABASE_URL must be a postgresql:// connection string for the connect_worker role"; exit 1 ;;
          esac
          if printf '%s' "$WORKER_DATABASE_URL" | grep -q "[[:space:]\"'\\\\]"; then
            echo "::error::WORKER_DATABASE_URL contains a space, quote or backslash; generate the connect_worker password with letters and digits only (docs/DEPLOY.md)"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
      - name: Build
        if: steps.check.outputs.run == 'true'
        run: |
          pnpm --dir worker install --frozen-lockfile --ignore-workspace
          pnpm --dir worker test
          pnpm --dir worker build
          tar -czf "connect-$APP-$GITHUB_SHA.tgz" -C worker/dist .
      - name: Release on the droplet
        if: steps.check.outputs.run == 'true'
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          WORKER_DATABASE_CA: ${{ vars.WORKER_DATABASE_CA }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://qenubcnvjcmsxhmehvat.supabase.co' }}
          # Optional platform secrets: a handler whose variables are missing reports
          # "not configured" in Settings › Integrations instead of pretending.
          SUPABASE_SECRET_KEY: ${{ secrets.WORKER_SUPABASE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_CLIENT_ID: ${{ secrets.STRIPE_CLIENT_ID }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # o-messaging (optional)
          POSTMARK_ACCOUNT_TOKEN: ${{ secrets.POSTMARK_ACCOUNT_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ vars.TWILIO_FROM_NUMBER }}
          MESSAGING_FROM_ADDRESS: ${{ vars.MESSAGING_FROM_ADDRESS }}
          MESSAGING_FROM_NAME: ${{ vars.MESSAGING_FROM_NAME }}
          MESSAGING_LINK_SECRET: ${{ secrets.MESSAGING_LINK_SECRET }}
          PORTAL_PUBLIC_URL: ${{ vars.PORTAL_PUBLIC_URL }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_() { ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST" "$@"; }
          ssh_ "mkdir -p /tmp/connect-deploy"
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/droplet-setup.sh deploy/release.sh "root@$HOST:/tmp/connect-deploy/"
          scp -i ~/.ssh/deploy -o BatchMode=yes "connect-$APP-$GITHUB_SHA.tgz" "root@$HOST:/tmp/"
          ssh_ "bash /tmp/connect-deploy/droplet-setup.sh"
          # The env file carries the database password: sent over SSH stdin (never on a
          # command line), written root-only (600); systemd reads it before dropping to
          # the connect user. Empty optional values are left out.
          {
            printf 'WORKER_DATABASE_URL=%s\n' "$WORKER_DATABASE_URL"
            printf 'WORKER_HEALTH_PORT=%s\n' "$HEALTH_PORT"
            printf 'WORKER_ID=%s\n' "droplet-worker"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            for v in SUPABASE_SECRET_KEY STRIPE_SECRET_KEY STRIPE_CLIENT_ID PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET \
                     INTUIT_CLIENT_ID INTUIT_CLIENT_SECRET RESEND_API_KEY POSTMARK_SERVER_TOKEN \
                     TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN ANTHROPIC_API_KEY \
                     POSTMARK_ACCOUNT_TOKEN EXPO_ACCESS_TOKEN TWILIO_FROM_NUMBER MESSAGING_FROM_ADDRESS MESSAGING_FROM_NAME \
                     MESSAGING_LINK_SECRET PORTAL_PUBLIC_URL; do
              if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}"; fi
            done
            if [ -n "$WORKER_DATABASE_CA" ]; then printf 'WORKER_DATABASE_CA=%s\n' /srv/connect/worker-ca.crt; fi
          } | ssh_ "umask 077 && mkdir -p /srv/connect && cat > /srv/connect/$APP.env.new && mv -f /srv/connect/$APP.env.new /srv/connect/$APP.env"
          if [ -n "$WORKER_DATABASE_CA" ]; then
            printf '%s\n' "$WORKER_DATABASE_CA" | ssh_ "cat > /srv/connect/worker-ca.crt && chmod 644 /srv/connect/worker-ca.crt"
          fi
          ssh_ "bash /tmp/connect-deploy/release.sh $APP $GITHUB_SHA worker $HEALTH_PORT -"
          echo "### Released the background service" >> "$GITHUB_STEP_SUMMARY"
          echo "connect@worker is running; Settings › Integrations shows its heartbeat." >> "$GITHUB_STEP_SUMMARY"
