# Runs on every pull request: nothing merges (and so nothing deploys) unless the app
# type-checks, lints, passes its tests and builds. Placeholder Supabase values are used for
# the build; the real ones are injected only by the deploy workflow.
name: App checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          CI: "true"
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # The background service (worker/) is its own package with its own lockfile.
      - name: Background service (typecheck, test, build)
        run: |
          pnpm --dir worker install --frozen-lockfile --ignore-workspace
          pnpm --dir worker typecheck
          pnpm --dir worker test
          pnpm --dir worker build
