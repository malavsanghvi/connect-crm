<link rel="stylesheet" href="weaver-tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400&display=swap">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--canvas); }
  .cover svg { position: absolute; inset: 0; }
  .navy { fill: var(--navy); }
  .saffron { fill: var(--saffron); }
  .tint { fill: var(--navy-50); }
  .gold { fill: var(--gold); }
  .ring { fill: none; stroke: var(--saffron); stroke-width: 8px; }
  .r-hero { rx: var(--radius-hero); }
  .r-card { rx: var(--radius-card); }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 80px; font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; color: var(--ink); }
  .tagline { margin: 16px 0 0; font-family: var(--font-sans); font-size: 14px; color: var(--muted); }
</style>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: navy slab 224 x 352 (radius-hero), saffron 256 x 192 (radius-hero), navy-50 256 x 144 (radius-card), gold sun r 56; all sides multiples of gap-lg (16px).
      arrangement: one tall indigo slab bleeding top and bottom, with a sunrise block and a lavender block stacked to its right, bleeding off the right edge.
      pattern: the sun from the logo rising on indigo, two rings around it (the "literal motif" row); Weaver's own mark is a sun over the W, so the shape says Weaver before the name does.
      scales: gap-lg 16 for sizes and gaps, ring stroke 8 (half of gap-lg), radius-hero 32 and radius-card 24.
    -->
    <rect class="navy r-hero" x="496" y="-32" width="224" height="352" />
    <rect class="saffron r-hero" x="736" y="-32" width="256" height="192" />
    <rect class="tint r-card" x="736" y="176" width="256" height="144" />
    <circle class="ring" cx="608" cy="176" r="104" />
    <circle class="ring" cx="608" cy="176" r="80" />
    <circle class="gold" cx="608" cy="176" r="56" />
  </svg>
  <div class="text">
    <p class="name">Weaver<br>Brand Kit</p>
    <p class="tagline">Do more good. Weaver handles the operations.</p>
  </div>
</div>
